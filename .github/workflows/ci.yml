name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest data sample
        run: python src/data_pipeline/ingest.py --sample 100

      - name: Validate UCI data
        run: python src/data_pipeline/validate.py

      - name: Run tests
        run: pytest tests/ -v --tb=short

